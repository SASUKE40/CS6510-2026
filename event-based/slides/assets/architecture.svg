<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1134" viewBox="0 0 1800 1134" font-family="'Inter', sans-serif">
  <title>Event-based self-checkout: four microservices that communicate only through a Kafka event broker</title>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#2F80ED"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#FF7900"/></marker>
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#BDBDBD"/></marker>
    <g id="icon-db" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="10" ry="4"/>
      <path d="M2,5 V19 A10,4 0 0 0 22,19 V5"/>
      <path d="M2,12 A10,4 0 0 0 22,12"/>
    </g>
  </defs>
  <rect width="1800" height="1134" fill="#000000"/>

  <!-- title -->
  <text x="900" y="62" text-anchor="middle" font-size="50" font-weight="700" fill="#FF7900">Event-Based Self-Checkout</text>
  <text x="900" y="100" text-anchor="middle" font-size="24" fill="#F5F5F5">The services do not call other services. They send all messages through Kafka.</text>

  <g transform="translate(0,24)">
  <!-- ===== connectors (drawn before cards) ===== -->
  <!-- client to gateway -->
  <path d="M84,240 V466" fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-dasharray="8 9" stroke-linecap="round" marker-end="url(#arrow-grey)"/>
  <text x="98" y="360" font-size="20" fill="#D6D6D6">HTTP</text>
  <text x="98" y="384" font-size="20" fill="#D6D6D6">:8080</text>

  <!-- gateway to services (public routes) -->
  <g fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-dasharray="8 9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276,545 H296 V138 H1520"/>
    <path d="M380,138 V152" marker-end="url(#arrow-grey)"/>
    <path d="M1520,138 V152" marker-end="url(#arrow-grey)"/>
    <path d="M296,545 V968 H1050"/>
    <path d="M380,968 V950" marker-end="url(#arrow-grey)"/>
    <path d="M1050,968 V950" marker-end="url(#arrow-grey)"/>
  </g>
  <circle cx="296" cy="545" r="5" fill="#BDBDBD"/>
  <text x="420" y="128" font-size="20" fill="#D6D6D6">HTTP: the gateway sends each request to the correct service.</text>

  <!-- service to broker: publish (blue, arrow at broker) and consume (orange, arrow at service) -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <!-- payment (top) -->
    <path d="M458,300 V366" stroke="#2F80ED" marker-end="url(#arrow-blue)"/>
    <path d="M694,370 V304" stroke="#FF7900" marker-end="url(#arrow-orange)"/>
    <path d="M1166,300 V366" stroke="#2F80ED" marker-end="url(#arrow-blue)"/>
    <path d="M1402,370 V304" stroke="#FF7900" marker-end="url(#arrow-orange)"/>
    <!-- analytics (top) -->
    <path d="M1638,370 V304" stroke="#FF7900" stroke-dasharray="8 9" marker-end="url(#arrow-orange)"/>
    <!-- inventory (bottom) -->
    <path d="M458,720 V786" stroke="#FF7900" marker-end="url(#arrow-orange)"/>
    <path d="M694,790 V724" stroke="#2F80ED" marker-end="url(#arrow-blue)"/>
    <path d="M880,790 V724" stroke="#2F80ED" stroke-dasharray="8 9" marker-end="url(#arrow-blue)"/>
    <!-- basket (bottom) -->
    <path d="M1030,720 V786" stroke="#FF7900" stroke-dasharray="8 9" marker-end="url(#arrow-orange)"/>
    <path d="M1166,720 V786" stroke="#FF7900" marker-end="url(#arrow-orange)"/>
    <path d="M1402,790 V724" stroke="#2F80ED" marker-end="url(#arrow-blue)"/>
    <path d="M1638,790 V724" stroke="#2F80ED" stroke-dasharray="8 9" marker-end="url(#arrow-blue)"/>
  </g>
  <g fill="#FF7900">
    <circle cx="458" cy="370" r="5"/><circle cx="694" cy="370" r="5"/><circle cx="1166" cy="370" r="5"/>
    <circle cx="1402" cy="370" r="5"/><circle cx="1638" cy="370" r="5"/>
    <circle cx="458" cy="720" r="5"/><circle cx="694" cy="720" r="5"/><circle cx="880" cy="720" r="5"/>
    <circle cx="1030" cy="720" r="5"/><circle cx="1166" cy="720" r="5"/><circle cx="1402" cy="720" r="5"/>
    <circle cx="1638" cy="720" r="5"/>
  </g>

  <!-- ===== client ===== -->
  <g fill="none" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(60,170)">
    <rect x="2" y="4" width="44" height="30" rx="4"/>
    <path d="M24,34 V42 M14,44 H34"/>
  </g>
  <text x="120" y="192" font-size="22" font-weight="700" fill="#F5F5F5">Load client</text>
  <text x="120" y="218" font-size="20" fill="#D6D6D6">Java test program</text>

  <!-- ===== gateway ===== -->
  <rect x="40" y="470" width="236" height="150" rx="12" fill="#000" stroke="#BDBDBD" stroke-width="1.75"/>
  <g fill="none" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round" transform="translate(60,488)">
    <circle cx="20" cy="20" r="18"/>
    <ellipse cx="20" cy="20" rx="8" ry="18"/>
    <path d="M2,20 H38"/>
  </g>
  <text x="112" y="516" font-size="22" font-weight="700" fill="#F5F5F5">:8080</text>
  <text x="60" y="560" font-size="22" font-weight="700" fill="#F5F5F5">checkout-gateway</text>
  <text x="60" y="586" font-size="20" fill="#D6D6D6">Sends each request</text>
  <text x="60" y="610" font-size="20" fill="#D6D6D6">to one service</text>

  <!-- ===== legend ===== -->
  <rect x="40" y="664" width="236" height="210" rx="12" fill="#000" stroke="#484848" stroke-width="1.25"/>
  <text x="60" y="698" font-size="22" font-weight="700" fill="#F5F5F5">Legend</text>
  <g stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M60,724 H96" stroke="#2F80ED" marker-end="url(#arrow-blue)"/>
    <path d="M60,756 H96" stroke="#FF7900" marker-end="url(#arrow-orange)"/>
    <path d="M60,788 H96" stroke="#F5F5F5"/>
    <path d="M60,820 H96" stroke="#F5F5F5" stroke-dasharray="8 9"/>
    <path d="M60,852 H96" stroke="#BDBDBD" stroke-dasharray="8 9"/>
  </g>
  <g font-size="20" fill="#F5F5F5">
    <text x="110" y="731">sends</text>
    <text x="110" y="763">reads</text>
    <text x="110" y="795">saga step</text>
    <text x="110" y="827">event stream</text>
    <text x="110" y="859">HTTP request</text>
  </g>

  <!-- ===== top services ===== -->
  <rect x="340" y="156" width="1120" height="144" rx="12" fill="#000" stroke="#2F80ED" stroke-width="1.75"/>
  <g fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(364,176)">
    <rect x="0" y="6" width="48" height="34" rx="5"/>
    <path d="M0,16 H48 M8,30 H20"/>
  </g>
  <text x="428" y="200" font-size="26" font-weight="700" fill="#2F80ED">payment-service <tspan font-weight="400" fill="#F5F5F5">:8083</tspan></text>
  <text x="428" y="234" font-size="20" fill="#F5F5F5">Controls the checkout saga. Sends the receipt when the stock is reserved.</text>
  <use href="#icon-db" x="428" y="250" stroke="#D6D6D6"/>
  <text x="462" y="270" font-size="20" fill="#D6D6D6">payment.sqlite · saga state and payments</text>

  <rect x="1490" y="156" width="266" height="144" rx="12" fill="#000" stroke="#2F80ED" stroke-width="1.75"/>
  <g fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" transform="translate(1510,172)">
    <path d="M2,40 H42 M8,36 V24 M18,36 V10 M28,36 V18 M38,36 V4"/>
  </g>
  <text x="1564" y="190" font-size="22" font-weight="700" fill="#F5F5F5">:8084</text>
  <use href="#icon-db" x="1564" y="198" stroke="#D6D6D6" transform="translate(1564,198) scale(0.75) translate(-1564,-198)"/>
  <text x="1590" y="214" font-size="20" fill="#D6D6D6">analytics.sqlite</text>
  <text x="1510" y="250" font-size="22" font-weight="700" fill="#2F80ED">analytics-service</text>
  <text x="1510" y="278" font-size="20" fill="#F5F5F5">Counts the popular items</text>

  <!-- ===== broker ===== -->
  <rect x="316" y="370" width="1448" height="350" rx="20" fill="#000" stroke="#FF7900" stroke-width="1.75"/>
  <g fill="none" stroke="#FF7900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(340,392)">
    <rect x="0" y="6" width="48" height="34" rx="6"/>
    <path d="M12,6 V40 M24,6 V40 M36,6 V40"/>
  </g>
  <text x="404" y="424" font-size="32" font-weight="700" fill="#FF7900">Kafka event broker</text>
  <text x="716" y="422" font-size="20" fill="#F5F5F5">Keeps each message until the service that needs it reads it.</text>
  <path d="M340,448 H1740" stroke="#484848" stroke-width="1.25"/>
  <text x="694" y="484" text-anchor="middle" font-size="22" font-weight="700" fill="#D6D6D6">inventory.*</text>
  <text x="1402" y="484" text-anchor="middle" font-size="22" font-weight="700" fill="#D6D6D6">basket.*</text>
  <g stroke="#484848" stroke-width="1.25">
    <path d="M576,500 V700 M812,500 V700 M1284,500 V700 M1520,500 V700"/>
  </g>
  <path d="M1048,462 V700" stroke="#7A7A7A" stroke-width="1.5"/>

  <g text-anchor="middle" font-size="20">
    <text x="458" y="530" font-size="24" font-weight="700" fill="#FF7900">commands</text>
    <text x="458" y="558" fill="#D6D6D6">payment → inventory</text>
    <text x="458" y="594" fill="#F5F5F5">Reserve</text>
    <text x="458" y="620" fill="#F5F5F5">Cancel</text>

    <text x="694" y="530" font-size="24" font-weight="700" fill="#FF7900">events</text>
    <text x="694" y="558" fill="#D6D6D6">inventory → payment</text>
    <text x="694" y="594" fill="#F5F5F5">StockReserved</text>
    <text x="694" y="620" fill="#F5F5F5">StockRejected</text>
    <text x="694" y="646" fill="#F5F5F5">ReservationCancelled</text>

    <text x="930" y="530" font-size="24" font-weight="700" fill="#FF7900">catalog</text>
    <text x="930" y="558" fill="#D6D6D6">inventory → basket</text>
    <text x="930" y="594" fill="#F5F5F5">CatalogPublished</text>

    <text x="1166" y="530" font-size="24" font-weight="700" fill="#FF7900">commands</text>
    <text x="1166" y="558" fill="#D6D6D6">payment → basket</text>
    <text x="1166" y="594" fill="#F5F5F5">Checkout</text>
    <text x="1166" y="620" fill="#F5F5F5">Release</text>
    <text x="1166" y="646" fill="#F5F5F5">Complete</text>

    <text x="1402" y="530" font-size="24" font-weight="700" fill="#FF7900">events</text>
    <text x="1402" y="558" fill="#D6D6D6">basket → payment</text>
    <text x="1402" y="594" fill="#F5F5F5">BasketLocked</text>
    <text x="1402" y="620" fill="#F5F5F5">BasketReleased</text>
    <text x="1402" y="646" fill="#F5F5F5">BasketCompleted</text>
    <text x="1402" y="672" fill="#F5F5F5">+ 3 error replies</text>

    <text x="1638" y="530" font-size="24" font-weight="700" fill="#FF7900">scans</text>
    <text x="1638" y="558" fill="#D6D6D6">basket → analytics</text>
    <text x="1638" y="594" fill="#F5F5F5">ItemScanned</text>
    <text x="1638" y="620" fill="#F5F5F5">one for each scan</text>
  </g>

  <!-- ===== bottom services ===== -->
  <rect x="340" y="790" width="640" height="156" rx="12" fill="#000" stroke="#2F80ED" stroke-width="1.75"/>
  <g fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(364,810)">
    <path d="M24,2 L46,13 V37 L24,48 L2,37 V13 Z M2,13 L24,24 L46,13 M24,24 V48"/>
  </g>
  <text x="428" y="834" font-size="26" font-weight="700" fill="#2F80ED">inventory-service <tspan font-weight="400" fill="#F5F5F5">:8081</tspan></text>
  <text x="428" y="866" font-size="20" fill="#F5F5F5">Keeps the stock. Reserves items for a checkout.</text>
  <use href="#icon-db" x="428" y="882" stroke="#D6D6D6"/>
  <text x="462" y="902" font-size="20" fill="#D6D6D6">inventory.sqlite</text>

  <rect x="1010" y="790" width="746" height="156" rx="12" fill="#000" stroke="#2F80ED" stroke-width="1.75"/>
  <g fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(1034,810)">
    <path d="M2,6 H10 L16,34 H40 L46,14 H13"/>
    <circle cx="20" cy="42" r="3"/><circle cx="36" cy="42" r="3"/>
  </g>
  <text x="1098" y="834" font-size="26" font-weight="700" fill="#2F80ED">basket-service <tspan font-weight="400" fill="#F5F5F5">:8082</tspan></text>
  <text x="1098" y="864" font-size="20" fill="#F5F5F5">Keeps the baskets and a copy of the catalog.</text>
  <text x="1098" y="892" font-size="20" fill="#F5F5F5">Saves each scan first. Then sends it to Kafka.</text>
  <use href="#icon-db" x="1098" y="904" stroke="#D6D6D6"/>
  <text x="1132" y="924" font-size="20" fill="#D6D6D6">basket.sqlite</text>

  <!-- ===== insight strip ===== -->
  <rect x="40" y="992" width="1716" height="88" rx="16" fill="#000" stroke="#BDBDBD" stroke-width="1.75"/>
  <circle cx="92" cy="1036" r="26" fill="none" stroke="#FF7900" stroke-width="2.5"/>
  <g fill="none" stroke="#FF7900" stroke-width="3" stroke-linecap="round" transform="translate(76,1022)">
    <rect x="0" y="4" width="32" height="22" rx="4"/>
    <path d="M10,4 V26 M21,4 V26"/>
  </g>
  <text x="136" y="1044" font-size="24" font-weight="700" fill="#F5F5F5">Services know only Kafka</text>
  <path d="M480,1008 V1064" stroke="#484848" stroke-width="1.25"/>
  <text x="508" y="1030" font-size="20" fill="#F5F5F5">Payment sends commands. Inventory and basket send replies.</text>
  <text x="508" y="1058" font-size="20" fill="#F5F5F5">When a service stops, its messages stay in Kafka until it starts again.</text>
  </g>
</svg>
